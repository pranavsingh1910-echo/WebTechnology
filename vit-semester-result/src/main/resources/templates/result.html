<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Semester Result</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .result-box {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .title {
            text-align: center;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .student-details {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .summary {
            margin-top: 25px;
        }
    </style>
</head>

<body>

<div class="result-box">

    <h2 class="title">VIT Semester Result</h2>

    <!-- Student Details -->

    <div class="student-details">

        <div class="row">

            <div class="col-md-6">
                <strong>Student Name:</strong>
                <span th:text="${studentResult.studentName}"></span>
            </div>

            <div class="col-md-6">
                <strong>Roll Number:</strong>
                <span th:text="${studentResult.rollNo}"></span>
            </div>

        </div>

    </div>


    <!-- Marks Table -->

    <h5 class="mb-3">Subject-wise Marks</h5>

    <div class="table-responsive">

        <table class="table table-bordered text-center">

            <thead class="table-dark">

            <tr>
                <th>Subject</th>
                <th>MSE (30%)</th>
                <th>ESE (70%)</th>
                <th>Final Marks</th>
            </tr>

            </thead>

            <tbody>

            <tr>
                <td>Subject 1</td>
                <td th:text="${studentResult.subject1Mse}"></td>
                <td th:text="${studentResult.subject1Ese}"></td>
                <td th:text="${studentResult.subject1Mse * 0.30 + studentResult.subject1Ese * 0.70}"></td>
            </tr>

            <tr>
                <td>Subject 2</td>
                <td th:text="${studentResult.subject2Mse}"></td>
                <td th:text="${studentResult.subject2Ese}"></td>
                <td th:text="${studentResult.subject2Mse * 0.30 + studentResult.subject2Ese * 0.70}"></td>
            </tr>

            <tr>
                <td>Subject 3</td>
                <td th:text="${studentResult.subject3Mse}"></td>
                <td th:text="${studentResult.subject3Ese}"></td>
                <td th:text="${studentResult.subject3Mse * 0.30 + studentResult.subject3Ese * 0.70}"></td>
            </tr>

            <tr>
                <td>Subject 4</td>
                <td th:text="${studentResult.subject4Mse}"></td>
                <td th:text="${studentResult.subject4Ese}"></td>
                <td th:text="${studentResult.subject4Mse * 0.30 + studentResult.subject4Ese * 0.70}"></td>
            </tr>

            </tbody>

        </table>

    </div>


    <!-- Result Summary -->

    <div class="summary">

        <div class="row text-center">

            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-body">
                        <h6>Total Marks</h6>
                        <h4 th:text="${studentResult.totalMarks}"></h4>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-body">
                        <h6>Percentage</h6>
                        <h4>
                            <span th:text="${studentResult.percentage}"></span>%
                        </h4>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-body">
                        <h6>Grade</h6>
                        <h4 th:text="${studentResult.grade}"></h4>
                    </div>
                </div>
            </div>

        </div>

        <div class="text-center mt-3">

            <h3 th:text="${studentResult.result}"></h3>

        </div>

    </div>


    <!-- Back Button -->

    <div class="text-center mt-4">

        <a href="/" class="btn btn-primary">
            Calculate Another Result
        </a>

    </div>

</div>

</body>
</html>
