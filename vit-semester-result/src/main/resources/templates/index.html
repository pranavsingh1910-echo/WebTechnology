<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VIT Semester Result</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .container-box {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .subject-title {
            margin-top: 25px;
            margin-bottom: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container-box">

    <h2 class="title">VIT Semester Result</h2>

    <form action="/calculate" method="post">

        <!-- Student Details -->

        <div class="row">

            <div class="col-md-6 mb-3">
                <label class="form-label">Student Name</label>
                <input type="text"
                       name="studentName"
                       class="form-control"
                       placeholder="Enter student name"
                       required>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Roll Number</label>
                <input type="text"
                       name="rollNo"
                       class="form-control"
                       placeholder="Enter roll number"
                       required>
            </div>

        </div>


        <!-- Subject 1 -->

        <h5 class="subject-title">Subject 1</h5>

        <div class="row">

            <div class="col-md-6 mb-3">
                <label class="form-label">MSE Marks (30%)</label>
                <input type="number"
                       name="subject1Mse"
                       class="form-control"
                       min="0"
                       max="30"
                       step="0.01"
                       required>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">ESE Marks (70%)</label>
                <input type="number"
                       name="subject1Ese"
                       class="form-control"
                       min="0"
                       max="70"
                       step="0.01"
                       required>
            </div>

        </div>


        <!-- Subject 2 -->

        <h5 class="subject-title">Subject 2</h5>

        <div class="row">

            <div class="col-md-6 mb-3">
                <label class="form-label">MSE Marks (30%)</label>
                <input type="number"
                       name="subject2Mse"
                       class="form-control"
                       min="0"
                       max="30"
                       step="0.01"
                       required>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">ESE Marks (70%)</label>
                <input type="number"
                       name="subject2Ese"
                       class="form-control"
                       min="0"
                       max="70"
                       step="0.01"
                       required>
            </div>

        </div>


        <!-- Subject 3 -->

        <h5 class="subject-title">Subject 3</h5>

        <div class="row">

            <div class="col-md-6 mb-3">
                <label class="form-label">MSE Marks (30%)</label>
                <input type="number"
                       name="subject3Mse"
                       class="form-control"
                       min="0"
                       max="30"
                       step="0.01"
                       required>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">ESE Marks (70%)</label>
                <input type="number"
                       name="subject3Ese"
                       class="form-control"
                       min="0"
                       max="70"
                       step="0.01"
                       required>
            </div>

        </div>


        <!-- Subject 4 -->

        <h5 class="subject-title">Subject 4</h5>

        <div class="row">

            <div class="col-md-6 mb-3">
                <label class="form-label">MSE Marks (30%)</label>
                <input type="number"
                       name="subject4Mse"
                       class="form-control"
                       min="0"
                       max="30"
                       step="0.01"
                       required>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">ESE Marks (70%)</label>
                <input type="number"
                       name="subject4Ese"
                       class="form-control"
                       min="0"
                       max="70"
                       step="0.01"
                       required>
            </div>

        </div>


        <div class="text-center mt-4">

            <button type="submit"
                    class="btn btn-primary btn-lg">
                Calculate Result
            </button>

        </div>

    </form>

</div>

</body>
</html>
